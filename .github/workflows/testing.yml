name: Testing

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs:
    name: Run PHPCS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer phpcs

  phpstan:
    name: Run PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      # Deliberately NOT caching PHPStan's own result-cache (.phpstan-result-cache /
      # analysis cache under the system temp dir): measurement showed the OOM this
      # gate is prone to only happens against a dirty/invalidated result-cache — a
      # clean checkout (= empty cache) is the lowest-memory path and passes
      # reliably. Restoring that cache across runs would reintroduce the exact
      # failure mode we're avoiding. The Composer dependency cache above is a
      # different, unrelated cache and is safe to keep.
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript correctness gate (all shipped JS and JSX)
        run: composer check-js-correctness

      - name: PHPStan level 0 (no baseline — dead-reference gate)
        run: composer phpstan:0

      - name: PHPStan level 5 (baselined)
        run: composer phpstan

      - name: Guarded-reference check (class_exists()/interface_exists() dead-ref guard)
        run: composer check-guarded-refs

      - name: WP.org compliance oracle (zero edition/license/gating tokens)
        run: composer check-no-pro-refs

      # The three gates below live in `composer carve-gates` but no job invoked
      # them, so they only ran when somebody chose to run carve-gates by hand.
      # A gate nobody is obliged to run is a gate that is not enforcing anything
      # -- and the crippleware one backs a public promise, which makes the gap
      # worse than internal: the plugin page states there are no vehicle,
      # booking or listing caps, and until now nothing on the automated path
      # would have caught a limit creeping back in.
      - name: Crippleware oracle (no artificial vehicle/booking/listing caps)
        run: composer crippleware

      - name: Unguarded Pro-class references (allowlisted classes must be guarded)
        run: composer check-unguarded-pro-refs

      # Deny-list, not a discovery tool: it fails if one of the third-party
      # hosts earlier versions used reappears in the PHP we ship. readme.txt
      # cites it under "External services", so it belongs on the path that
      # always runs, not one that has to be remembered.
      - name: Third-party host regression fence (no reintroduced external services)
        run: composer check-external-http

      # Carve-out whitelist invariant: src/ must be EXACTLY the Lite keep-list,
      # in both directions. A file in src/ but not in the manifest is a Pro file
      # that crept back -- the silent regression the carve-out exists to prevent,
      # and one a blacklist cannot detect. A file in the manifest but not in src/
      # means the manifest is lying about what Lite ships.
      #
      # This gate existed but could never run: it read carveout/, a directory
      # .gitignore excludes, so a clean clone had no input and it exited 1 for a
      # missing file rather than a real mismatch -- and no job invoked it. The
      # manifest is now tracked in bin/, next to the gate that consumes it.
      - name: Carve-out manifest invariant (src/ == Lite keep-list)
        run: composer check-manifest

      # Reproducible-build gate. Runs here rather than in a Node job on purpose:
      # it needs no node_modules, and the defect it catches is precisely one an
      # `npm ci` would have caught but nobody ever ran on a clean tree.
      # Single-repo checkout means it reports mhm-rentiva-pro as NOT AUDITED --
      # that is stated in its output, not hidden.
      - name: React import declarations (src-react/ imports vs package.json)
        run: composer check-react-imports

      # The ui-core version literal in mhm-rentiva.php cannot be read from the
      # package (registration precedes any bootstrap), so nothing but a gate keeps
      # the two in step. It had already drifted through three releases -- 0.2.0
      # declared against an installed 0.3.2 -- and an independent audit found it,
      # not a gate. Under-reporting is silent while we are the only registrant, and
      # hands the selection to an older copy the moment we are not.
      - name: ui-core version literal matches the installed package
        run: composer check-uicore-version

      # The endpoint-map gate, and it is here because of a defect on the OTHER
      # side of the seam. The carve (0ecc9368) removed the paid sections from
      # src-react/shared/api/rentiva.js -- correctly -- and the add-on's five
      # React screens, which byte-copy that file, lost every endpoint they call.
      # Two of them died outright for nineteen days.
      #
      # Nothing saw it: check-react-imports measures package imports and a map
      # KEY is not a package, PHPStan and PHPCS do not read JavaScript, no
      # PHPUnit suite mounts React, and those screens had never been opened in a
      # browser. So the comparison nobody was making -- members CALLED against
      # members DEFINED -- is now made on both sides, and this run covers ours.
      #
      # The add-on runs this same file against its own map through MHM_API_*, the
      # cross-repo shape check-react-imports and build-i18n.py already use. It
      # lives here rather than there because this workflow is single-repo by
      # design and must never need a private sibling to go green.
      - name: React endpoint map (members called vs members defined)
        run: composer check-react-api-map

      # The companion to the gate above, and it exists because of how the same
      # outage LOOKED. One broken map took out five of the add-on's screens at
      # once; three were wrapped in <ErrorBoundary> and said "an error occurred",
      # two were not and React unmounted the tree -- a blank page under the admin
      # chrome with nothing saying what failed. Sweeping for the class found a
      # third unguarded screen in THIS repo (shortcode-pages), which is why this
      # is a gate and not three edits.
      #
      # A boundary fixes nothing. It decides whether a failure reads as "this
      # screen is broken" or as "this plugin is broken", and the second is what
      # an operator reports. The check looks inside the render() call, not the
      # file: importing ErrorBoundary and not using it is exactly the half-done
      # edit a file-wide grep would call clean.
      - name: React error boundaries (every screen mounts guarded)
        run: composer check-react-error-boundary

      # React translation catalogs. Runs here for the same reason as the gate
      # above: the CHECKING half of bin/build-i18n.py reads only the .po and
      # languages/*.json, so it needs no Docker, no Node and no network — only
      # the GENERATING half needs WP-CLI in a container. Invoked directly rather
      # than through a composer script because ubuntu ships `python3` while the
      # Windows dev boxes ship `python`, and a script that works on one and not
      # the other is worse than an explicit line here.
      #
      # Why this exists: for four months make-json silently produced zero React
      # files (its default extension set is .js/.min.js; every reference in our
      # .pot is a .jsx path) while --no-purge kept the stale ones alive and the
      # old assertion checked only that a file existed. Five already-translated
      # strings shipped in English. An existence check cannot see that; this one
      # compares the catalogs' revision date and contents against the .po.
      - name: React translation catalogs (languages/*.json vs the committed .po)
        run: python3 bin/build-i18n.py --verify-only

      # Translation placeholder parity. A translator may change the words; a
      # changed PLACEHOLDER changes behaviour. Found 2026-08-24: seven Turkish
      # subjects rendered {{booking.id}} where the source says
      # {{booking.order_id}}, so every transactional e-mail showed the internal
      # post id in its subject and the WooCommerce order number in its body --
      # two different numbers for one booking, in one message.
      #
      # Nothing above can see this class. msgfmt -c validates printf conversions
      # (%s, %d), not {{dot.path}}/{token}, and reported the catalog clean with
      # all seven present. build-i18n.py --verify-only compares the committed
      # catalogs against the committed .po, and both sides agreed on the wrong
      # token. No test renders a translated subject. The first observer was a
      # customer.
      - name: Translation placeholder parity (msgstr keeps msgid's placeholders)
        run: composer check-i18n-placeholders

      # Design-token definition gate. REPORT-ONLY on purpose while the token
      # slice runs: the composer script passes --report-only, so this step
      # prints its verdict and exits 0. It flips to blocking (drop the flag) in
      # the PR that deletes the copied declaration blocks and brings the shared
      # count to zero -- the measure exists before the change, without holding
      # CI red across three merges. Today it prints 3 shared tokens
      # (--mhm-font-base, --mhm-radius, --mhm-text) and 4 canonical-file
      # duplicates; those numbers are the slice's starting baseline.
      - name: Design token definitions (report-only until the token slice lands)
        run: composer check-token-definitions

      # The other half. A stylesheet that reads a token must be guaranteed the
      # file that defines it, or deleting the copied declaration blocks renders
      # those pages with every token unset. Also REPORT-ONLY for now.
      #
      # This job checks out only this repository, so it sees 23 registrations
      # that reach no canonical handle and 11 call sites it cannot read. Across
      # both trees the counts are 28 and 15 -- the paid plugin's five (including
      # VendorLedger.php:36 and VendorBookings.php:44, which enqueue THIS
      # plugin's stylesheets with array()) are caught by the same gate in the
      # paid plugin's pro-gates job, which checks out both trees.
      #
      # Unreadable call sites are listed one by one, never counted into a
      # threshold: a threshold lets a new unreadable call hide behind an old one.
      - name: Style token dependencies (report-only until the token slice lands)
        run: composer check-style-token-deps

      # Gate G-A (WP.org T7 remediation, Task 1): zero visible security shapes
      # (missing nonces / unescaped output / unsanitized input) under phpcs
      # --ignore-annotations, with one narrow allowed residual class (see the
      # script's own docblock). STILL `continue-on-error: true` after Task 10,
      # and this is a deliberate, escalated state rather than an oversight:
      # Task 10 drove EscapeOutput 7 -> 2 and NonceVerification.Missing /
      # ValidatedSanitizedInput to 0, leaving 56 NonceVerification.Recommended
      # hits on read-only, bookmarkable admin display params (?tab=, ?paged=,
      # ?page=, ?message=). No canonical shape silences that sniff for such a
      # param -- a nonce cannot gate a bookmarkable URL and get_query_var() is
      # unavailable on `admin.php?page=` screens.
      #
      # UPDATE (final audit, 2026-08-08): the unreachable AbstractListTable
      # surface and two now-unreachable files were deleted, closing 6 rows. The remaining 22 rows were traced
      # individually to sanitized, read-only routing/display GET parameters.
      # They remain visible (no PHPCS suppression); check-shape-zero.php keeps
      # per-file and global ceilings so any new row is blocking. Current output:
      #   G-A: hard=0, residual-display=22 (tavan 22)
      - name: "Security shape gate (G-A: nonce/escape/sanitize; 22 audited read-only GET rows)"
        run: php bin/check-shape-zero.php

      # Gate G-B (WP.org T7 remediation, Task 2): five grep-based probes for
      # classes WPCS is structurally blind to but WP.org's reviewer flagged
      # anyway (filter_input UNSAFE_RAW/DEFAULT, CSS-context strip_tags,
      # unkeyed array_map into update_option, third-party host strings, and
      # the multiline compound-nonce-condition shape). Complementary to G-A,
      # not a replacement -- G-A is phpcs-based and can only ever see what a
      # sniff is written to detect. BLOCKING as of Task 10: all five probes
      # read 0. The last to fall was const-external-host, which was firing on
      # a comment explaining a URL that had already been deleted -- the probe
      # cannot tell a live host string from a description of a removed one, so
      # the comment was reworded rather than the probe narrowed.
      - name: "Instrument-gap gate (G-B: five WPCS-blind probes)"
        run: php bin/check-instrument-gaps.php

      # Gate G-C (WP.org T7 remediation, Task 3): prefix-inventory bijection +
      # migration-map completeness. Six modes -- bijection/uniqueness, post_type/
      # taxonomy length limits, baseline-inventory coverage, post-sweep no-old-
      # names, option-call coverage, and cron-hook coverage -- verify
      # PrefixMigrationMap.php (the single source of truth Task 12's rename
      # sweep and Task 13's DB migration both read) is complete before either
      # of those later tasks may rely on it.
      #
      # BLOCKING as of 2026-08-02. It was `continue-on-error: true` while mode 4
      # (post-sweep-no-old-names) was expected red, on the stated condition that
      # it would become blocking once the rename sweep landed and mode 4 went
      # green. That condition is met: all six modes pass. Leaving the escape
      # hatch in place past its own precondition is how a gate quietly stops
      # being one.
      - name: "Prefix inventory gate (G-C: bijection + migration-map completeness)"
        run: php bin/check-prefix-inventory.php

      # Write-side inventory (WordPress.org T9 remediation).
      #
      # T9 rejected 6.0.6 over a wp_update_user() reachable from nothing: a
      # static service method with no caller in either edition. Two gates were
      # blind to it for the same structural reason -- bin/audit-object-
      # capabilities.php walks OUT from registered handlers, so a method no
      # registration reaches does not exist in its world, and it said "(none)"
      # truthfully. The suite was blind too: that round's two tests asserted
      # the blanket-only behaviour was CORRECT, so 1,740 green tests said
      # nothing about the defect.
      #
      # This gate starts from the opposite end -- the write itself. Calling
      # wp_create_user/wp_insert_user/wp_update_user/wp_delete_user/
      # wp_set_password or ->set_role/add_role/remove_role/add_cap/remove_cap
      # is a literal a tokenizer cannot miss, whether or not anything calls
      # the method containing it.
      #
      # It is an INVENTORY LOCK, not a verdict: it says "the set of places
      # that write a user account is exactly this one, and each has a recorded
      # justification", never "the guard beside it is correct". A new write
      # site fails the build until somebody writes down which check stands
      # beside it -- which is the question T9 asked and nothing here could
      # answer.
      - name: "User-account write inventory (T9: every user write is recorded)"
        run: composer check-user-writes

      # Gate G-D (WP.org T7 remediation): runs WP.org's Plugin Check ITSELF.
      #
      # HONESTY NOTE -- THIS STEP DOES NOT MEASURE ANYTHING ON CI TODAY.
      # G-D used to run a vendored copy of Plugin Check's ruleset through the
      # repo's own phpcs, which did work here but measured the wrong thing: the
      # copy lacked WordPress.Security.EscapeOutput and the four PluginCheck.*
      # sniffs, so it read "1 error / 56 warnings" where the real tool read
      # 4 errors -- two of them EscapeOutput, the family the fifth WP.org
      # review rejected this plugin over. It was also phpcs-only, and 13 of the
      # plugin_repo category's checks are not phpcs at all (readme/stable tag,
      # hidden files, trademarks, file types, ...).
      #
      # The gate now shells out to `wp plugin check` in the Docker WP stack, so
      # it needs a WordPress install plus the plugin-check plugin. This runner
      # has neither, so the step exits 2 ("cannot measure") and says why. That
      # is deliberate: a gate that cannot run must be loud, not silently green.
      # Making it real on CI means provisioning WP + plugin-check in this
      # workflow -- not done yet, and `continue-on-error` is what keeps that
      # debt visible instead of red-washing the build.
      #
      # Locally: `php bin/check-plugin-check-parity.php`.
      # UPDATE (T8 Görev 16, 2026-08-04): the 2026-08-02 baseline below is
      # superseded. restore_full_backup() no longer exists under that name
      # (its PreparedSQL.NotPrepared error went with it), a hidden_files
      # error from a newly-shipped .eslintrc.json came and went (Görev 15
      # added the file, Görev 16 excluded it in .distignore), and the owner's
      # K6 verdict (2026-08-04) stripped 11 suppressed
      # DirectDatabaseQuery.SchemaChange annotations, so the sniff now
      # reports everywhere it used to be silenced, not just the 10 the K1
      # shape left visible on purpose. Current gate output, quoted verbatim:
      #   G-D SUMMARY: errors=0 warnings=47 files_with_findings=13
      #   shipped_files=553 vendor_files_scanned=4
      #     25   W WordPress.DB.DirectDatabaseQuery.SchemaChange
      #     22   W WordPress.Security.NonceVerification.Recommended
      # 47 = 22 nonce (gate G-A above) + 25 SchemaChange (K1/K6, both families
      # already accounted for elsewhere in this file) -- zero new, unexplained
      # warnings. errors=0 was this task's own exit criterion.
      #
      # Superseded baseline (2026-08-02), kept for the historical record: 1
      # error / 97 warnings over the 571 files .distignore shipped then. The
      # single error was DatabaseCleaner::restore_full_backup()
      # (PreparedSQL.NotPrepared, product decision pending); readme.txt's
      # stable-tag mismatch was fixed in the 6.0.0 release commit, which is
      # why that figure was 1/97 and not the 2/99 stated before it.
      #
      # KNOWN HOLE, to close after submission: this gate honours phpcs
      # annotations, so it cannot see the suppressed surface at all -- while the
      # house rule is that suppressions ARE the WP.org review queue. G-A ignores
      # annotations but skips PrefixAllGlobals; G-D covers PrefixAllGlobals but
      # respects annotations. Neither sees the 966 findings behind the 76
      # directives, which sit on exactly the sniff the fifth rejection named. Do
      # not change this before submission: the reply letter cites these numbers,
      # and moving the instrument now would invalidate the verification table.
      - name: "Plugin Check gate (G-D: real tool; exits 2 = cannot measure on CI)"
        run: php bin/check-plugin-check-parity.php
        continue-on-error: true

  phpunit:
    name: Run PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Install SVN (required by install-wp-tests.sh)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      # WooCommerce is not part of the WordPress test suite, and without it 26
      # source files take their "WooCommerce absent" branch -- which is how the
      # refund and checkout paths went unmeasured until 2026-08-18. The version
      # is pinned to the one the dev site runs so CI and a developer's machine
      # answer the same question; WooCommerceTestEnvironmentTest fails loudly if
      # this step is ever dropped or the download silently produces nothing.
      - name: Install WooCommerce into the test tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress/wp-content/plugins
          curl -sSL --fail -o /tmp/woocommerce.zip \
            https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip
          unzip -q /tmp/woocommerce.zip -d /tmp/wordpress/wp-content/plugins
          test -f /tmp/wordpress/wp-content/plugins/woocommerce/woocommerce.php

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test

      # G-E runs in this job because it needs a WordPress CORE TREE to read --
      # not a running site. install-wp-tests.sh puts one at /tmp/wordpress, and
      # this is the only job that has it.
      #
      # It reads wp-admin/includes/ and wp-includes/ with the tokenizer and
      # takes the difference. An earlier version derived the set at runtime from
      # get_defined_functions(), which was wrong twice over: on a dev machine
      # other active plugins preloaded parts of the admin API and those
      # functions silently left the inventory, and HERE it measured nothing at
      # all -- there is no configured site in CI, wp-load.php failed, an output
      # buffer swallowed the error, and the gate exited 0 without ever printing
      # its summary line. Reading files needs no database, no config and no
      # plugins, so CI and a developer's machine get the same answer.
      #
      # The gate fails closed if the tree cannot be read, and checks four known
      # admin-only functions are present rather than trusting a count: a count
      # alone stayed plausible while a whole family was missing.
      - name: Admin-only function load-context gate (G-E)
        env:
          WP_CORE_DIR: /tmp/wordpress
        run: composer check-admin-only
