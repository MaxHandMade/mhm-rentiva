name: WordPress trunk canary

# Weekly: the suite against the WordPress nightly build, so a change in the next
# release (wp_kses() reordering attributes in 7.2, for one) shows up before it
# ships. Schedule and manual runs only -- never on a pull request, so it blocks
# no merge. And no continue-on-error: with it a failed run reports success,
# GitHub sends no failure mail, and the canary never sings (rentiva-lisans,
# 2026-11-04).
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit-trunk:
    name: Run PHPUnit (PHP 8.4, WP trunk)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Install SVN (required by install-wp-tests.sh)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install WordPress trunk and its test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 trunk

      - name: Check the installed WordPress version
        run: bash bin/check-wp-version.sh /tmp/wordpress trunk

      # The newest WooCommerce and Elementor, not the pinned ones: the canary
      # asks what the next WordPress does to the plugin as sites will run it.
      - name: Install WooCommerce and Elementor (latest stable)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress/wp-content/plugins
          for p in woocommerce elementor; do
            curl -sSL --fail -o "/tmp/$p.zip" "https://downloads.wordpress.org/plugin/$p.latest-stable.zip"
            unzip -q "/tmp/$p.zip" -d /tmp/wordpress/wp-content/plugins
            test -f "/tmp/wordpress/wp-content/plugins/$p/$p.php"
          done
          # The Elementor pin follows whatever latest-stable was today.
          v=$(grep -o "define( 'ELEMENTOR_VERSION', '[^']*'" /tmp/wordpress/wp-content/plugins/elementor/elementor.php | sed "s/.*, '//; s/'$//")
          test -n "$v"
          echo "MHMRENTIVA_TEST_ELEMENTOR_VERSION=$v" >> "$GITHUB_ENV"

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test

  # Alarm + clear copied from Rentiva Pro's wp-trunk.yml (Pro #147, 2026-11-19):
  # without them a red scheduled canary only mails whoever last edited the cron
  # line, and Pro #133 sat red for two weeks unnoticed.
  trunk-alarm:
    name: Report a red trunk canary
    needs: [ phpunit-trunk ]
    if: ${{ failure() && github.event_name == 'schedule' }}
    # GitHub-hosted on purpose, like Pro's nightly-alarm: it calls gh (not in the
    # self-hosted image) and must raise the alarm when the dev machine is off.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the trunk canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="WordPress trunk canary is red"
          body="The weekly run against WordPress trunk failed: ${RUN_URL}

          Read the run first: if the job never started (it waits up to 24 hours for the self-hosted runner, so a dev machine that was off reads as a failure), just re-run it. Otherwise something in the next WordPress release (or the newest WooCommerce / Elementor) breaks Rentiva Lite's suite. Close this issue once a canary run is green again."
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            url="$(gh issue create --title "${title}" --body "${body}")"
            gh issue edit "${url}" --add-assignee "${OWNER}" || true
          fi

  trunk-clear:
    name: Close the trunk canary issue when green
    # 2026-11-19: the alarm opened/commented the issue on red but nothing closed it on green
    # (Pro #95 stayed open three green nights). Self-hosted with curl+jq on purpose: gh is not in
    # the image, and a job on every green night would cost GitHub minutes for nothing.
    needs: [ phpunit-trunk ]
    if: ${{ success() && github.event_name == 'schedule' }}
    runs-on: ${{ vars.MHM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the trunk canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="WordPress trunk canary is red"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          # A failed lookup must not turn a green run red: nothing to close is fine.
          nums="$(curl -fsS "${auth[@]}" "${API}/issues?state=open&per_page=100"             | jq -r --arg t "$title" '.[] | select(.pull_request | not) | select(.title == $t) | .number' || true)"
          for n in $nums; do
            curl -fsS "${auth[@]}" -X POST "${API}/issues/${n}/comments"               -d "$(jq -n --arg b "Green again: ${RUN_URL} -- closed by the workflow." '{body: $b}')" >/dev/null || true
            curl -fsS "${auth[@]}" -X PATCH "${API}/issues/${n}" -d '{"state":"closed","state_reason":"completed"}' >/dev/null               && echo "closed #${n}" || echo "could not close #${n}"
          done
          [ -n "$nums" ] || echo "no open '${title}' issue"
